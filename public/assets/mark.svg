<svg class="lively-svg-mark w-full h-full" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="navyOuterGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#191654" />
                                    <stop offset="55%" stop-color="#241b70" />
                                    <stop offset="100%" stop-color="#35218a" />
                                </linearGradient>
                                <linearGradient id="ribbonSwooshGrad" x1="34" y1="56" x2="78" y2="85" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#ff7847" />
                                    <stop offset="50%" stop-color="#e03e6d" />
                                    <stop offset="100%" stop-color="#6b21a8" />
                                </linearGradient>
                                <linearGradient id="warmPagesGrad" x1="60" y1="82" x2="90" y2="54" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#ea580c" />
                                    <stop offset="50%" stop-color="#f97316" />
                                    <stop offset="100%" stop-color="#fbbf24" />
                                </linearGradient>
                                <filter id="squircleShadow" x="14" y="16" width="92" height="92" filterUnits="userSpaceOnUse">
                                    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#090724" flood-opacity="0.45"/>
                                </filter>
                            </defs>

                            <!-- 1. Outer Deep Indigo-Navy Circle -->
                            <circle cx="60" cy="60" r="60" fill="url(#navyOuterGrad)" />
                            <circle cx="60" cy="60" r="58.5" stroke="rgba(255,255,255,0.14)" stroke-width="1" />

                            <!-- 2. Inner White Rounded Squircle -->
                            <rect x="21" y="21" width="78" height="78" rx="22" fill="#ffffff" filter="url(#squircleShadow)" />

                            <!-- 3. Bold Dark-Navy 'L' Stem & Base -->
                            <path d="M37 42 C37 33, 44 28, 50 28 L50 74 C50 78, 53 80, 60 80 L76 80 L89 73 L81 88 C79 90, 75 91, 69 91 L49 91 C40 91, 37 84, 37 74 Z" fill="#171546" />

                            <!-- 4. Animated Fanning Golden-Orange Book Pages -->
                            <g class="svg-book-pages">
                                <path d="M60 81 C65 71, 72 60, 83 56 C78 65, 75 73, 74 82 Z" fill="url(#warmPagesGrad)" />
                                <path d="M74 82 C77 73, 82 65, 89 62 C85 69, 81 76, 77 82 Z" fill="url(#warmPagesGrad)" opacity="0.92" />
                                <path d="M77 82 C81 75, 86 70, 92 67 C89 73, 84 78, 80 82 Z" fill="url(#warmPagesGrad)" opacity="0.82" />
                            </g>

                            <!-- 5. Swooping Coral-Magenta-Purple Ribbon Across L Curve -->
                            <path d="M37 56 C39 71, 53 77, 74 84 L55 84 C42 84, 37 77, 37 66 Z" fill="url(#ribbonSwooshGrad)" />

                            <!-- 6. Dynamic Rising Human Figure Reaching for the Star -->
                            <g class="svg-human-figure">
                                <circle cx="61.5" cy="52.5" r="4" fill="#171546" />
                                <path d="M53 77 C53 65, 58 60, 65 57.5 C69 55.5, 72 50, 74.5 44 C73.5 53, 69 61, 63.5 67 C60.5 70, 59 74, 58 78 Z" fill="#171546" />
                            </g>

                            <!-- 7. Pulsing 4-Point Golden Star -->
                            <g class="svg-golden-star">
                                <path d="M73 29 L75.3 34.7 L81 37 L75.3 39.3 L73 45 L70.7 39.3 L65 37 L70.7 34.7 Z" fill="#f59e0b" />
                            </g>
                        </svg>
